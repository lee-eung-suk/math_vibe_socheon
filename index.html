<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학이 팡팡! 소천 코딩 놀이터</title>
    <!-- 폰트 설정: Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- 테일윈드 CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --apple-blur: blur(6px);
            --apple-bg: rgba(255, 255, 255, 0.2);
            --apple-card-bg: rgba(255, 255, 255, 0.15);
            --primary-color: #6366f1;
            --accent-color: #f59e0b;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('https://i.imgur.com/sHAsB2M.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #0f172a;
            overflow-x: hidden;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5);
        }

        /* 글래스모피즘 오버레이 */
        .glass-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--apple-bg);
            backdrop-filter: var(--apple-blur);
            -webkit-backdrop-filter: var(--apple-blur);
            z-index: -1;
        }

        /* 프리미엄 카드 스타일 */
        .apple-card {
            background: var(--apple-card-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .apple-card:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.2);
            background: rgba(255, 255, 255, 0.4);
            border-color: var(--primary-color);
        }

        /* 알약 형태 버튼 */
        .pill-button {
            border-radius: 999px;
            background: var(--primary-color);
            color: white;
            padding: 12px 28px;
            font-weight: 700;
            transition: all 0.3s ease;
            display: inline-block;
            text-align: center;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .pill-button:hover {
            background: #4f46e5;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
        }

        /* 글래스모피즘 패널 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
        }

        /* 입력 폼 스타일 */
        .glass-input {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            padding: 12px 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            background: rgba(255, 255, 255, 0.6);
            border-color: #0071e3;
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1);
        }

        /* 애니메이션 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }

        /* 부드러운 스크롤 */
        html {
            scroll-behavior: smooth;
        }

        /* 관리자 버튼 */
        .admin-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 11px;
            color: rgba(0, 0, 0, 0.3);
            cursor: pointer;
            z-index: 1000;
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            transition: all 0.3s;
            border: 1px solid rgba(0,0,0,0.05);
            user-select: none;
        }

        .admin-btn:hover {
            color: rgba(0, 0, 0, 0.6);
            background: rgba(255, 255, 255, 0.4);
        }

        /* 삭제 버튼 */
        .delete-btn {
            color: #ff3b30;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 10px;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(255, 59, 48, 0.1);
            transition: background 0.3s;
        }

        .delete-btn:hover {
            background: rgba(255, 59, 48, 0.2);
        }
    </style>
</head>
<body>
    <div class="glass-overlay"></div>

    <!-- 상단 네비게이션 -->
    <nav class="fixed top-0 w-full z-50 bg-white/30 backdrop-blur-md border-b border-white/20">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="text-lg font-black tracking-tighter text-gray-900">
                소천초등학교 <span style="color: var(--primary-color)">바이브코딩</span>
            </div>
            <div class="flex gap-8 text-sm font-bold text-gray-700 items-center">
                <a href="#gallery" class="hover:text-indigo-600 transition-colors">작품 보기</a>
                <a href="#guestbook" class="hover:text-indigo-600 transition-colors">방명록</a>
                <a href="#" onclick="openAdminModal()" class="hover:text-indigo-600 transition-colors flex items-center gap-1 bg-gray-100/80 px-3 py-1.5 rounded-full text-xs ml-2"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg> 관리자</a>
            </div>
        </div>
    </nav>

    <!-- 메인 헤더 -->
    <header class="pt-40 pb-20 px-6 text-center">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-5xl md:text-7xl font-black tracking-tighter mb-8 fade-in" style="word-break: keep-all; text-shadow: 0 2px 10px rgba(255,255,255,0.8);">
                생각을 코딩하다: <br><span style="color: var(--primary-color)">AI로 수학 게임 만들기</span>
            </h1>
            <div class="glass-panel p-8 md:p-10 fade-in" style="animation-delay: 0.2s;">
                <p class="text-lg md:text-xl text-gray-600 leading-relaxed font-medium" style="word-break: keep-all;">
                    소천초 꼬마 개발자들의 수학 게임 갤러리.<br>
                    직접 만든 게임으로 수학의 즐거움을 느껴보세요.
                </p>
            </div>
        </div>
    </header>

    <!-- 작품 갤러리 -->
    <section id="gallery" class="max-w-[1600px] mx-auto px-6 py-20">
        <div class="flex items-center justify-between mb-12">
            <h2 class="text-3xl font-bold tracking-tight">학생 작품 갤러리</h2>
            <div class="h-1 flex-1 mx-8 bg-gray-200/50 rounded-full hidden md:block"></div>
        </div>
        
        <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-8">
            <!-- 자바스크립트로 렌더링 -->
        </div>
    </section>

    <!-- 방명록 섹션 -->
    <section id="guestbook" class="max-w-4xl mx-auto px-6 py-32">
        <div class="text-center mb-16">
            <h2 class="text-3xl font-bold mb-4">응원의 한마디 (방명록)</h2>
            <p class="text-gray-500 font-medium">학생들의 멋진 도전을 응원해주세요!</p>
        </div>

        <!-- 방명록 입력 폼 -->
        <div class="glass-panel p-8 mb-16">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" id="guest-name" placeholder="이름" class="glass-input md:col-span-1">
                <input type="text" id="guest-content" placeholder="응원 메시지를 남겨주세요" class="glass-input md:col-span-2">
                <button onclick="addMessage()" class="pill-button w-full h-full">남기기</button>
            </div>
        </div>

        <!-- 방명록 리스트 -->
        <div id="guestbook-list" class="space-y-4">
            <!-- 자바스크립트로 렌더링 -->
        </div>
    </section>

    <!-- 푸터 -->
    <footer class="py-32 text-center text-gray-400 text-sm font-bold tracking-widest">
        <p>© 2026 소천초등학교 수학 바이브코딩 전시회. 모든 권리 보유.</p>
    </footer>

    <!-- 관리자 버튼 -->
    <div class="admin-btn" onclick="adminLogin()">관리자</div>

    <script>
        // 1. Supabase 설정 및 연결
        const SUPABASE_URL = 'https://uihdvkezxlilaieaygte.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpaGR2a2V6eGxpbGFpZWF5Z3RlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwNDQyNDcsImV4cCI6MjA5MTYyMDI0N30.sMYU39Bi4YEQYC0KWE3qt5Az3KzbdouhcFfcvI52hJQ';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let isAdmin = false;

        // 학생 데이터
        const students = [
            { grade: 6, name: "이한솔", links: [{ title: "게임 즐기기", url: "https://thunderous-tiramisu-c66508.netlify.app/" }] },
            { grade: 6, name: "주은혜", links: [{ title: "게임 즐기기", url: "https://benevolent-begonia-bc9c59.netlify.app/" }] },
            { grade: 4, name: "송설", links: [{ title: "게임 즐기기", url: "https://resplendent-hamster-cc9519.netlify.app/" }] },
            { grade: 4, name: "주사랑", links: [{ title: "게임 즐기기", url: "https://wonderful-llama-88e59e.netlify.app/" }] },
            { grade: 3, name: "정하온", links: [{ title: "게임 즐기기", url: "https://whimsical-beignet-5166a0.netlify.app/" }] },
            { grade: 3, name: "이승하", links: [{ title: "게임 즐기기", url: "https://exquisite-cendol-f49f4a.netlify.app/" }] },
            { grade: 3, name: "이지훈", links: [{ title: "게임 즐기기", url: "https://earnest-syrniki-eb43a3.netlify.app/" }] },
            { grade: 3, name: "이지호", links: [{ title: "게임 즐기기", url: "https://effortless-beijinho-c83792.netlify.app/" }] },
            { grade: 2, name: "남하늘", links: [
                { title: "작품 1 즐기기", url: "https://jocular-brigadeiros-ae812c.netlify.app/" },
                { title: "작품 2 즐기기", url: "https://tranquil-monstera-b62765.netlify.app/" }
            ] },
            { grade: 2, name: "정라온", links: [
                { title: "작품 1 즐기기", url: "https://shiny-crostata-646197.netlify.app/" },
                { title: "작품 2 즐기기", url: "https://dapper-belekoy-d2569a.netlify.app/" }
            ] }
        ];

        // 과정중심평가 상태 관리
        window.evaluationData = {};
        function getEvalState(studentName) {
            if (!window.evaluationData[studentName]) {
                window.evaluationData[studentName] = {
                    type: '동료평가',
                    scores: { math: 0, creative: 0, effort: 0 }
                };
            }
            return window.evaluationData[studentName];
        }

        // 갤러리 렌더링
        const galleryGrid = document.getElementById('gallery-grid');
        students.forEach((student, index) => {
            const card = document.createElement('div');
            card.className = 'apple-card p-8 flex flex-col items-center text-center fade-in group relative';
            card.style.animationDelay = `${index * 0.05}s`;
            
            let linksHtml = '';
            student.links.forEach((link) => {
                linksHtml += `<a href="${link.url}" target="_blank" class="pill-button text-sm w-full">${link.title}</a>`;
            });

            const evalCriteria = [
                { id: 'math', label: '수학적 활용', tooltip: '수학 원리를 게임 규칙에 잘 적용했나요?' },
                { id: 'creative', label: '창의적 아이디어', tooltip: '게임의 방식이나 디자인이 참신한가요?' },
                { id: 'effort', label: '문제해결 노력', tooltip: '어려움을 극복하고 끝까지 완성도 있게 만들었나요?' }
            ];

            let criteriaHtml = evalCriteria.map(c => `
                <div class="flex items-center justify-between">
                    <div class="group/tooltip relative flex items-center cursor-help">
                        <span class="text-xs font-semibold text-gray-700 border-b border-dashed border-gray-400 pb-0.5">${c.label}</span>
                        <div class="absolute bottom-full left-0 mb-2 w-48 p-2.5 bg-gray-800 text-white text-[11px] leading-relaxed rounded-lg shadow-xl opacity-0 invisible group-hover/tooltip:opacity-100 group-hover/tooltip:visible transition-all z-30 pointer-events-none text-left">
                            ${c.tooltip}
                            <div class="absolute top-full left-4 w-2 h-2 bg-gray-800 rotate-45 -mt-1"></div>
                        </div>
                    </div>
                    <div class="flex gap-1 eval-stars" data-student="${student.name}" data-criterion="${c.id}">
                        ${[1,2,3,4,5].map(star => `
                            <button type="button" class="eval-star-btn text-gray-300 hover:text-yellow-400 transition-colors focus:outline-none" data-value="${star}">
                                <svg class="w-5 h-5 pointer-events-none" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            card.innerHTML = `
                <div class="w-full flex flex-col items-center transition-transform duration-300 group-hover:-translate-y-2">
                    <div class="w-16 h-16 bg-indigo-100/50 rounded-2xl flex items-center justify-center mb-6 shadow-inner">
                        <span class="text-2xl font-black text-indigo-600">${student.grade}</span>
                    </div>
                    <div class="mb-2 text-xs font-black text-indigo-500 uppercase tracking-[0.2em]">${student.grade}학년</div>
                    <h3 class="text-2xl font-black mb-6 text-gray-900 tracking-tighter">${student.name}</h3>
                    <div class="w-full flex flex-col gap-2 mt-auto relative z-20">
                        ${linksHtml}
                    </div>
                </div>

                <!-- 평가 패널 (Hover Expand) -->
                <div class="w-full overflow-hidden max-h-0 opacity-0 group-hover:max-h-[500px] group-hover:opacity-100 group-hover:mt-6 transition-all duration-500 ease-in-out flex flex-col pointer-events-none group-hover:pointer-events-auto">
                    <div class="bg-gray-50/90 rounded-2xl p-4 border border-gray-100 shadow-inner w-full text-left">
                        <!-- 탭 메뉴 -->
                        <div class="flex bg-gray-200 p-1 rounded-lg mb-4 w-full" data-student="${student.name}">
                            <button type="button" class="eval-tab-btn flex-1 py-1.5 text-xs font-bold rounded-md bg-white text-indigo-600 shadow-sm transition-all" data-type="동료평가">동료평가</button>
                            <button type="button" class="eval-tab-btn flex-1 py-1.5 text-xs font-bold rounded-md text-gray-500 hover:text-gray-700 transition-all" data-type="자기평가">자기평가</button>
                        </div>
                        
                        <!-- 별점 항목 -->
                        <div class="flex flex-col gap-3 mb-5">
                            ${criteriaHtml}
                        </div>
                        
                        <button type="button" class="eval-submit-btn w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl transition-colors shadow-md" data-student="${student.name}">
                            평가 제출하기
                        </button>
                    </div>
                </div>
            `;
            galleryGrid.appendChild(card);
        });

        // 평가 이벤트 델리게이션
        document.addEventListener('click', async (e) => {
            // 탭 클릭
            if (e.target.closest('.eval-tab-btn')) {
                const btn = e.target.closest('.eval-tab-btn');
                const studentName = btn.closest('.flex').dataset.student;
                const type = btn.dataset.type;
                const state = getEvalState(studentName);
                state.type = type;
                
                const container = btn.parentElement;
                container.querySelectorAll('.eval-tab-btn').forEach(b => {
                    if (b.dataset.type === type) {
                        b.className = 'eval-tab-btn flex-1 py-1.5 text-xs font-bold rounded-md bg-white text-indigo-600 shadow-sm transition-all';
                    } else {
                        b.className = 'eval-tab-btn flex-1 py-1.5 text-xs font-bold rounded-md text-gray-500 hover:text-gray-700 transition-all';
                    }
                });
            }
            
            // 별점 클릭
            if (e.target.closest('.eval-star-btn')) {
                const btn = e.target.closest('.eval-star-btn');
                const value = parseInt(btn.dataset.value);
                const starsContainer = btn.closest('.eval-stars');
                const studentName = starsContainer.dataset.student;
                const criterion = starsContainer.dataset.criterion;
                
                const state = getEvalState(studentName);
                state.scores[criterion] = value;
                
                starsContainer.querySelectorAll('.eval-star-btn').forEach(b => {
                    const bVal = parseInt(b.dataset.value);
                    if (bVal <= value) {
                        b.classList.remove('text-gray-300');
                        b.classList.add('text-yellow-400');
                    } else {
                        b.classList.remove('text-yellow-400');
                        b.classList.add('text-gray-300');
                    }
                });
            }
            
            // 제출 클릭
            if (e.target.closest('.eval-submit-btn')) {
                const btn = e.target.closest('.eval-submit-btn');
                const studentName = btn.dataset.student;
                const state = getEvalState(studentName);
                
                if (state.scores.math === 0 || state.scores.creative === 0 || state.scores.effort === 0) {
                    alert("모든 평가 항목에 별점을 입력해주세요.");
                    return;
                }
                
                const output = {
                    target_student: studentName,
                    evaluation_type: state.type,
                    score_math: state.scores.math,
                    score_creative: state.scores.creative,
                    score_effort: state.scores.effort,
                    created_at: new Date().toISOString()
                };
                
                const originalText = btn.innerText;
                btn.innerText = "제출 중...";
                btn.disabled = true;

                try {
                    // 1. 로컬 스토리지에 데이터 누적 저장 (관리자 대시보드용)
                    const localData = JSON.parse(localStorage.getItem('evaluations_v1') || '[]');
                    localData.push({
                        id: Date.now(),
                        studentName: studentName,
                        type: state.type,
                        mathScore: state.scores.math,
                        creativityScore: state.scores.creative,
                        effortScore: state.scores.effort,
                        date: new Date().toISOString()
                    });
                    localStorage.setItem('evaluations_v1', JSON.stringify(localData));

                    // 2. Supabase 저장 시도 (선택적)
                    const { error } = await supabaseClient
                        .from('evaluations')
                        .insert([output]);

                    if (error) {
                        console.warn("Supabase 저장 실패 (로컬에는 정상 저장됨):", error.message);
                    }

                    alert(studentName + " 학생에 대한 " + state.type + "가 완료되었습니다!");
                    
                    // 제출 후 별점 초기화
                    state.scores = { math: 0, creative: 0, effort: 0 };
                    const cardPanel = btn.closest('.apple-card');
                    cardPanel.querySelectorAll('.eval-star-btn').forEach(b => {
                        b.classList.remove('text-yellow-400');
                        b.classList.add('text-gray-300');
                    });
                } catch (err) {
                    alert("평가 제출 중 오류가 발생했습니다. DB 설정을 확인해주세요: " + err.message);
                    console.error('Supabase Evaluation Insert Error:', err);
                } finally {
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            }
        });

        // 2. 방명록 로직 (Table: guestbook)
        async function fetchMessages() {
            const { data, error } = await supabaseClient
                .from('guestbook')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('데이터를 가져오는 중 오류 발생:', error);
                return;
            }
            renderMessages(data);
        }

        // 방명록 렌더링
        function renderMessages(messages) {
            const list = document.getElementById('guestbook-list');
            list.innerHTML = '';
            
            if (!messages || messages.length === 0) {
                list.innerHTML = '<div class="text-center py-10 text-gray-400 font-medium">첫 번째 응원 메시지를 남겨보세요!</div>';
                return;
            }

            messages.forEach((msg) => {
                const item = document.createElement('div');
                item.className = 'glass-panel p-8 fade-in shadow-lg flex justify-between items-start';
                item.innerHTML = `
                    <div class="flex-1">
                        <div class="flex items-center gap-3 mb-3">
                            <span class="font-black text-gray-900 text-lg">${msg.name}</span>
                            <span class="text-xs text-gray-400 font-bold">${new Date(msg.created_at).toLocaleDateString()}</span>
                            ${isAdmin ? `<span class="delete-btn" onclick="deleteMessage(${msg.id})">삭제</span>` : ''}
                        </div>
                        <p class="text-gray-600 font-medium text-lg leading-relaxed keep-all">${msg.content}</p>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        // 등록하기
        async function addMessage() {
            const name = document.getElementById('guest-name').value.trim();
            const content = document.getElementById('guest-content').value.trim();
            
            if (!name || !content) {
                alert('이름과 내용을 모두 입력해주세요!');
                return;
            }

            // created_at 값을 명시적으로 전송하여 Not-Null 제약 조건 오류 해결
            const { error } = await supabaseClient
                .from('guestbook')
                .insert([{ 
                    name, 
                    content, 
                    created_at: new Date().toISOString() 
                }]);

            if (error) {
                alert(`등록 중 오류가 발생했습니다: ${error.message}`);
                console.error('Supabase Insert Error:', error);
            } else {
                document.getElementById('guest-name').value = '';
                document.getElementById('guest-content').value = '';
                fetchMessages();
            }
        }

        // 3. 관리자 모드 구현
        function adminLogin() {
            if (isAdmin) {
                if (confirm("관리자 모드를 해제하시겠습니까?")) {
                    isAdmin = false;
                    const btn = document.querySelector('.admin-btn');
                    btn.innerText = "관리자";
                    btn.style.color = "rgba(0,0,0,0.3)";
                    btn.style.background = "rgba(255, 255, 255, 0.2)";
                    fetchMessages();
                }
                return;
            }

            const id = prompt("관리자 아이디를 입력하세요.");
            if (id === null) return;
            const pw = prompt("관리자 비밀번호를 입력하세요.");
            if (pw === null) return;

            if (id === 'sc6727414' && pw === 'sc6727414') {
                isAdmin = true;
                const btn = document.querySelector('.admin-btn');
                btn.innerText = "관리자 (로그아웃)";
                btn.style.color = "#4f46e5";
                btn.style.background = "rgba(99, 102, 241, 0.1)";
                alert("관리자 모드로 전환되었습니다.");
                fetchMessages();
            } else {
                alert("아이디 또는 비밀번호가 일치하지 않습니다.");
            }
        }

        // 삭제 기능
        async function deleteMessage(id) {
            if (!id) {
                alert("삭제할 메시지의 ID가 없습니다. DB에 'id' 컬럼이 있는지 확인해주세요.");
                return;
            }
            if (!confirm("정말 이 메시지를 삭제하시겠습니까?")) return;

            const { error } = await supabaseClient
                .from('guestbook')
                .delete()
                .eq('id', id);

            if (error) {
                alert(`삭제 중 오류가 발생했습니다: ${error.message}`);
                console.error('Supabase Delete Error:', error);
            } else {
                fetchMessages();
            }
        }

        // 초기 실행
        fetchMessages();

        // 부드러운 스크롤 이벤트
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    window.scrollTo({
                        top: target.offsetTop - 80,
                        behavior: 'smooth'
                    });
                }
            });
        });
    </script>

    <!-- 관리자 인증 모달 -->
    <div id="admin-login-modal" class="fixed inset-0 bg-black/50 z-[100] hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-8 max-w-sm w-full shadow-2xl transform transition-all">
            <h3 class="text-2xl font-black text-gray-900 mb-6 text-center">관리자 인증</h3>
            <input type="password" id="admin-pwd-input" placeholder="비밀번호 입력" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 mb-6 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono text-center tracking-widest text-lg" onkeypress="if(event.key === 'Enter') verifyAdmin()">
            <div class="flex gap-3">
                <button onclick="closeAdminModal()" class="flex-1 py-3 bg-gray-100 text-gray-600 font-bold rounded-xl hover:bg-gray-200 transition-colors">취소</button>
                <button onclick="verifyAdmin()" class="flex-1 py-3 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition-colors shadow-md shadow-indigo-200">확인</button>
            </div>
        </div>
    </div>

    <!-- 관리자 대시보드 모달 (전체 화면) -->
    <div id="admin-dashboard-modal" class="fixed inset-0 bg-gray-50 z-[100] hidden flex flex-col overflow-hidden">
        <!-- 헤더 -->
        <div class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between shadow-sm z-10">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-100 rounded-xl flex items-center justify-center">
                    <span class="text-xl">📊</span>
                </div>
                <h2 class="text-xl md:text-2xl font-black text-gray-900 tracking-tight">과정중심평가 대시보드</h2>
            </div>
            <button onclick="closeAdminDashboard()" class="px-4 py-2 bg-gray-100 text-gray-600 hover:bg-gray-200 hover:text-gray-900 font-bold rounded-lg transition-colors text-sm">닫기 ✕</button>
        </div>
        
        <!-- 콘텐츠 영역 -->
        <div class="p-4 md:p-8 flex-1 overflow-auto">
            <div class="max-w-6xl mx-auto space-y-6">
                
                <!-- 컨트롤 패널 -->
                <div class="flex flex-col md:flex-row gap-4 justify-between bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                    <div class="flex flex-col md:flex-row gap-4 flex-1">
                        <div class="relative w-full max-w-xs">
                            <input type="text" id="eval-search-input" onkeyup="renderEvalTable()" placeholder="학생 이름 검색..." class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
                            <svg class="w-4 h-4 text-gray-400 absolute left-3.5 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </div>
                        <select id="eval-type-filter" onchange="renderEvalTable()" class="bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium text-gray-700">
                            <option value="all">전체 평가 구분 보기</option>
                            <option value="동료평가">동료평가만 보기</option>
                            <option value="자기평가">자기평가만 보기</option>
                        </select>
                    </div>
                    <button onclick="resetEvalData()" class="py-2.5 px-5 bg-red-50 text-red-600 border border-red-100 font-bold rounded-xl hover:bg-red-100 transition-colors text-sm flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        데이터 초기화
                    </button>
                </div>
                
                <!-- 테이블 -->
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse min-w-[800px]">
                            <thead>
                                <tr class="bg-gray-50/50 border-b border-gray-100 text-xs font-black text-gray-500 uppercase tracking-wider">
                                    <th class="p-4 pl-6 whitespace-nowrap">평가 일시</th>
                                    <th class="p-4 whitespace-nowrap">작품 학생 이름</th>
                                    <th class="p-4 whitespace-nowrap">구분</th>
                                    <th class="p-4 text-center whitespace-nowrap">수학적 활용</th>
                                    <th class="p-4 text-center whitespace-nowrap">창의적 아이디어</th>
                                    <th class="p-4 text-center whitespace-nowrap">문제해결 노력</th>
                                    <th class="p-4 text-center whitespace-nowrap pr-6">평균 점수</th>
                                </tr>
                            </thead>
                            <tbody id="eval-table-body" class="divide-y divide-gray-100 text-sm">
                                <!-- 데이터 렌더링 영역 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 관리자 모달 및 대시보드 로직
        function openAdminModal() {
            document.getElementById('admin-login-modal').classList.remove('hidden');
            const pwdInput = document.getElementById('admin-pwd-input');
            pwdInput.value = '';
            setTimeout(() => pwdInput.focus(), 100);
        }

        function closeAdminModal() {
            document.getElementById('admin-login-modal').classList.add('hidden');
        }

        function verifyAdmin() {
            const pwd = document.getElementById('admin-pwd-input').value;
            if (pwd === 'sc7414') {
                closeAdminModal();
                openAdminDashboard();
            } else {
                alert("비밀번호가 올바르지 않습니다.");
                document.getElementById('admin-pwd-input').focus();
            }
        }

        function openAdminDashboard() {
            document.getElementById('admin-dashboard-modal').classList.remove('hidden');
            renderEvalTable();
        }

        function closeAdminDashboard() {
            document.getElementById('admin-dashboard-modal').classList.add('hidden');
        }

        function renderEvalTable() {
            const tbody = document.getElementById('eval-table-body');
            const searchKeyword = document.getElementById('eval-search-input').value.toLowerCase().trim();
            const filterType = document.getElementById('eval-type-filter').value;
            
            const localData = JSON.parse(localStorage.getItem('evaluations_v1') || '[]');
            
            let filteredData = localData.filter(item => {
                const matchName = item.studentName.toLowerCase().includes(searchKeyword);
                const matchType = filterType === 'all' || item.type === filterType;
                return matchName && matchType;
            });

            // 내림차순 정렬 (최신순)
            filteredData.sort((a, b) => b.id - a.id);

            if (filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="p-12 text-center text-gray-400 font-medium">저장된 평가 데이터가 없습니다.</td></tr>';
                return;
            }

            tbody.innerHTML = filteredData.map(item => {
                const avg = ((item.mathScore + item.creativityScore + item.effortScore) / 3).toFixed(1);
                const dateObj = new Date(item.date);
                const dateStr = dateObj.toLocaleDateString('ko-KR', { month:'short', day:'numeric' }) + ' ' + 
                                dateObj.toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit', hour12: false });
                
                const typeStyle = item.type === '동료평가' 
                    ? 'bg-blue-50 text-blue-600 border border-blue-100' 
                    : 'bg-emerald-50 text-emerald-600 border border-emerald-100';

                return `
                    <tr class="hover:bg-gray-50/80 transition-colors group">
                        <td class="p-4 pl-6 text-gray-400 font-medium text-xs">${dateStr}</td>
                        <td class="p-4 font-black text-gray-800">${item.studentName}</td>
                        <td class="p-4"><span class="px-2.5 py-1 ${typeStyle} rounded-md text-[11px] font-bold tracking-tight">${item.type}</span></td>
                        <td class="p-4 text-center font-bold text-gray-700 group-hover:text-amber-500 transition-colors">⭐ ${item.mathScore}</td>
                        <td class="p-4 text-center font-bold text-gray-700 group-hover:text-amber-500 transition-colors">⭐ ${item.creativityScore}</td>
                        <td class="p-4 text-center font-bold text-gray-700 group-hover:text-amber-500 transition-colors">⭐ ${item.effortScore}</td>
                        <td class="p-4 pr-6 text-center font-black text-indigo-600 text-base">${avg}</td>
                    </tr>
                `;
            }).join('');
        }

        function resetEvalData() {
            if (confirm("정말로 모든 평가 데이터를 초기화하시겠습니까?\n(로컬 브라우저에 저장된 데이터가 모두 삭제되며, 이 작업은 되돌릴 수 없습니다.)")) {
                localStorage.removeItem('evaluations_v1');
                renderEvalTable();
            }
        }
    </script>
</body>
</html>
